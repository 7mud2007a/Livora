    <!-- Critical: the hero image (same srcset/sizes as the <img> in Hero.jsx, so the browser preloads the very file it will use)
         and the primary Latin faces. The Arabic face is preloaded by the script below when needed. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-960.webp"
      imagesrcset="/images/hero-640.webp 640w, /images/hero-960.webp 960w, /images/hero-1280.webp 1280w"
      imagesizes="(min-width: 900px) 48vw, 100vw"
      fetchpriority="high"
    />
    <link rel="preload" as="font" type="font/woff" href="/fonts/InterDisplay-Light.woff" crossorigin />
    <link rel="preload" as="font" type="font/woff" href="/fonts/Inter-Regular.woff" crossorigin />

    <script>
      // Apply the saved (or browser) language before first paint so there is no LTR/RTL flash.
      (function () {
        try {
          var lang = null;
          var q = new URLSearchParams(location.search).get('lang');
          if (q === 'ar' || q === 'en') lang = q;
          if (!lang) lang = localStorage.getItem('livora:lang');
          if (lang !== 'ar' && lang !== 'en') lang = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
          var d = document.documentElement;
          d.lang = lang;
          d.dir = lang === 'ar' ? 'rtl' : 'ltr';
          if (lang === 'ar') {
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'font';
            l.type = 'font/woff';
            l.href = '/fonts/SFArabic-Black.woff';
            l.crossOrigin = 'anonymous';
            document.head.appendChild(l);
          }
        } catch (e) {}
      })();
    </script>

    <style>
